# Netlify configuration for the competitive-intelligence dashboards.
#
# IMPORTANT: the site is built LOCALLY, not in Netlify CI. The dashboards pull
# from data/*_assets/ (gitignored, ~hundreds of MB) which is not in the repo, so
# a Git-connected CI build cannot regenerate them. Build here, deploy the folder:
#
#     python3 scripts/build_site.py        # produces dist/
#     netlify deploy --dir dist --prod     # or drag-drop dist/ at app.netlify.com
#
# (See NETLIFY.md.) `publish` is declared so `netlify deploy` and drag-drop both
# know dist/ is the site root. The build `command` is a safety net for the case
# where you DO build on a machine that has the data — it is a no-op-ish rebuild.

[build]
  publish = "dist"
  command = "python3 scripts/build_site.py"
  # SPECIFIC TO THE GITHUB ACTIONS DEPLOY OPTION — see
  # .github/workflows/deploy-dashboards.yml. That workflow presigns every
  # S3-hosted dashboard and deploys itself; if this Git-triggered build keeps
  # running too, the two race on every push, and whichever finishes last wins
  # — unsigned images if it's this one. `ignore = "exit 0"` unconditionally
  # skips this build (Netlify's own convention: exit 0 = skip, non-zero =
  # proceed), so the workflow is the only thing that ever publishes.
  #
  # ⚠ IF ANDREW PICKS THE OTHER OPTION INSTEAD (updating this same `command`
  # to build+presign in place, using Netlify's own env vars) — DELETE THIS
  # LINE. It would otherwise skip that build too, which needs to actually run.
  #
  # This is a belt-and-suspenders addition, not a substitute for using
  # Netlify's own "Stop builds" toggle (Site configuration → Build & deploy) —
  # that's the first-class, dashboard-verified way to disable this; this line
  # is the second, repo-visible guard in case that toggle ever gets flipped
  # back on by accident.
  ignore = "exit 0"

[build.environment]
  # Exclude the captured competitor assets from secret scanning. Everything under
  # data/ is scraped third-party content (competitor websites + ad creatives) and
  # local SQLite DBs — not our secrets (those live in the gitignored .env). The
  # scanner trips on third-party public keys embedded in captured landing.html,
  # e.g. trex.com's own referrer-restricted Google Maps key (`data-prop-googleapikey`).
  # The deployed dist/ contains only referenced image assets, never raw HTML.
  SECRETS_SCAN_OMIT_PATHS = "data/**"

# Long-cache the immutable creative assets; keep HTML revalidating so a redeploy
# is picked up immediately.
[[headers]]
  for = "/*/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep the whole site out of search engines and AI crawlers. These dashboards
# carry client competitive analysis and first-party ad-account performance
# (spend/ROAS/revenue); the site has no auth, so the URL is the only thing
# keeping it private and it must never be indexed or surfaced in a search result.
#
# Applied as an HTTP header (not just a <meta> tag) because it covers every
# response type — non-HTML assets included — and because crawlers honour
# X-Robots-Tag even when they never parse the document body. `noarchive` and
# `nosnippet` additionally stop cached copies and text excerpts being retained.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
