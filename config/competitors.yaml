# Source registry for Bob's Discount Furniture competitive set.
#
# Bob's positioning: value-tier furniture, primarily East Coast / Mid-Atlantic,
# expanding south + west. Competitive set chosen as:
#   - direct value-tier brick-and-mortar (Ashley, Rooms To Go, Raymour, Value City, American Freight)
#   - online disruptor competing for same household budget (Wayfair)
#
# Meta page_ids were verified by querying ads_archive with search_page_ids and
# inspecting whether returned ads use the brand's voice. method: scrape uses the
# Playwright path against the public Ad Library web UI — preferred for US
# commercial ads because the Graph API often omits currently-active commercial
# ads even when they're publicly visible on the web UI.

competitors:
  - id: bobs
    name: Bob's Discount Furniture
    vertical: furniture
    priority: high
    sources:
      - type: website
        url: https://www.mybobs.com
        cadence: daily
        watch: [hero, promo_banner, popup]
      - type: meta_ads
        page_id: "188327264572436"       # verified: Bob's Discount Furniture
        page_name: Bob's Discount Furniture
        country: US
        cadence: daily
        method: scrape
      # Google Ads Transparency Center (image + text ads). advertiser_id is the AR…
      # segment from adstransparency.google.com/advertiser/AR…  (resolved by domain
      # search via SerpApi). Google ads only appear in the with-Google reports
      # (intel dashboard --platform all + the bobs_google strategy deployment); the
      # Meta reports stay unchanged. method: auto uses SerpApi when SERPAPI_API_KEY
      # is set, else a Playwright scrape of the ATC.
      - type: google_ads
        advertiser_id: "AR14894637894638501889"   # Bob's Discount Furniture LLC
        page_name: Bob's Discount Furniture
        country: US
        cadence: daily
        method: auto
      # iSpot.tv national-TV spots. ispot_brand_id is the id from
      # ispot.tv/brands/<id>/<slug>. TV ads only appear in the with-TV / --platform
      # all reports; Meta + Google reports stay unchanged. method: auto scrapes the
      # public brand page (creative + airings + ranks; spend/impressions are
      # API-only) and uses ISPOT_API_KEY when set.
      - type: tv_ads
        ispot_brand_id: "Zzc"            # Bob's Discount Furniture
        page_name: Bob's Discount Furniture
        country: US
        cadence: daily
        method: auto

  - id: ashley
    name: Ashley Furniture
    vertical: furniture
    priority: high
    sources:
      - type: website
        url: https://www.ashleyfurniture.com
        cadence: daily
        watch: [hero, promo_banner, popup]
      - type: meta_ads
        page_id: "1623105244652335"      # verified: 'Ashley' US brand page
        page_name: Ashley
        country: US
        cadence: daily
        method: scrape
      - type: google_ads
        advertiser_id: "AR08780307608645926913"   # Ashley Global Retail, LLC.
        page_name: Ashley
        country: US
        cadence: daily
        method: auto
      # NOTE: brand 73T currently serves a marketing "hub" page with no
      # scrapeable spot grid, so the public-scrape path returns 0 spots (logged
      # as a warning, not an error). Populates once an ISPOT_API_KEY is set, or
      # swap in an alternate iSpot brand id that grids its commercials.
      - type: tv_ads
        ispot_brand_id: "73T"            # Ashley HomeStore
        page_name: Ashley HomeStore
        country: US
        cadence: daily
        method: auto

