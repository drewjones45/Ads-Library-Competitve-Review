      - type: meta_ads
        page_name: Rooms To Go
        country: US
        cadence: daily
      - type: google_ads
        advertiser_id: "AR12321955507991478273"   # Roomstogo.com, Inc.
        page_name: Rooms To Go
        country: US
        cadence: daily
        method: auto
      - type: tv_ads
        ispot_brand_id: "A2a"            # Rooms to Go
        page_name: Rooms to Go
        country: US
        cadence: daily
        method: auto

