# Source registry for the Philo streaming competitive set.
#
# Philo positioning: budget "skinny bundle" live-TV + on-demand streamer
# (~$28/mo, 70+ entertainment & lifestyle channels, NO sports/news). Subject
# brand of this deployment.
#
# Competitive set chosen as Philo's nearest live-TV streaming rivals across the
# price/feature spectrum:
#   - Frndly TV     — closest direct comp: budget, family/lifestyle, no sports
#   - Sling TV      — value-tier skinny bundle, adds sports/news tiers
#   - Fubo          — sports-first live-TV bundle (premium)
#   - Hulu + Live TV — full live-TV bundle + SVOD library (premium)
#   - YouTube TV    — full live-TV bundle, market leader (premium)
#   - AMC+          — added 2026-07-14 at user request. NOT a live-TV bundle:
#                     it's a ~$10/mo entertainment SVOD (AMC/Shudder/IFC/
#                     Sundance libraries). Competes with Philo on the same
#                     budget entertainment-streaming wallet and on the same
#                     "no sports, cheap, bingeable" wedge, but markets almost
#                     entirely via show-promo creative (The Walking Dead: Dead
#                     City, Anne Rice titles) rather than price/offer creative.
#                     Read its numbers as a content-marketing comp, not a
#                     bundle-price comp.
#
# -----------------------------------------------------------------------------
# Meta page_id resolution results (resolved + VERIFIED via ads_library_search
# MCP on 2026-06-15; followed the playbook in competitors_trex.yaml):
#   philo      → 160083100857719  VERIFIED (403 ads, page_name "Philo")
#   sling      → 1639268889632976 VERIFIED (page_name "Sling TV"; FIFA 2026 /
#                live-news creative). NOTE: a hyphenated impostor page
#                "Sling-TV" (860331323822227) runs scam "no download required"
#                creative — do NOT use it.
#   fubo       → 679262275469242  VERIFIED (604 ads, page_name "Fubo";
#                heavy FIFA World Cup / Telemundo Spanish-language creative)
#   hulu       → 6500552187       VERIFIED (page_name "Hulu"; "Stream Hulu +
#                Live TV" + show-promo creative)
#   frndly     → 389792694979812  VERIFIED (98 ads, page_name "Frndly TV")
#   youtube_tv → none. YouTube TV is an Alphabet/Google product and does not
#                run direct brand-page ads in the Meta Ad Library (keyword
#                searches return only resellers/spam). Same "fails gracefully"
#                bucket as Fiberon in the decking set — meta_ads source omitted;
#                website source only.
#
# -----------------------------------------------------------------------------
# Content-SVOD expansion (added 2026-07-15 at user request). These are premium
# on-demand streamers, NOT live-TV bundles — they compete with Philo for the
# same entertainment wallet (like AMC+), not on skinny-bundle price. page_ids
# supplied by the user and VERIFIED via ads_library_search on 2026-07-15:
#   netflix       → 6275848869      VERIFIED (page_name "Netflix")
#   hbomax        → 627947847690655 VERIFIED (page_name "HBO Max")
#   peacock       → 102202437839341 VERIFIED (page_name "Peacock TV")
#   starz         → 91570464218     VERIFIED (page_name "STARZ"; hard price
#                   creative e.g. "$24 FOR 1 YEAR", "$3/MO FOR 3 MONTHS")
#   mgmplus       → 45104949301     VERIFIED (page_name "MGM+"; only ~9 ads)
#   paramountplus → 113028887202008 VERIFIED (page_name "Paramount+")
#   appletv       → 100484820802    VERIFIED (page_name "Apple TV")
#   fxnow (FX)    → 17265241079     VERIFIED (page_name "FX Networks"; note the
#                   live creative is Emmy "Consider"/FYC awards advertising, not
#                   consumer acquisition — read the numbers with that in mind).
#                   There is no separate "FXNow" page; FX content streams on Hulu.
#
# Requested but NOT added (no active Meta brand-page ads — same fails-gracefully
# bucket as youtube_tv):
#   Showtime → folded into "Paramount+ with Showtime"; no standalone advertiser.
#   SYFY     → NBCUniversal cable net; content lives on Peacock; the page runs
#              no brand ads (free-text returns only resellers/spam). Omitted.
#
# Google Ads Transparency Center: ENABLED for Philo only (2026-06-16). The user
# primarily cares about Philo's Google Ads data, not the competitors', so only
# the subject brand carries a google_ads source. SerpApi's ATC engine offers no
# name search (text="Philo" → empty), but a domain query (text="philo.com")
# returns the advertiser; Philo's AR-id resolved + VERIFIED that way:
#   philo → AR13265893387262754817  ("Philo, Inc.", target_domain philo.com)
# Other brands' AR-ids remain unresolved and intentionally omitted.

competitors:
  - id: philo
    name: Philo
    vertical: streaming
    priority: high            # subject brand
    sources:
      - type: website
        url: https://www.philo.com
        cadence: daily
        watch: [hero, promo_banner, popup]
      - type: meta_ads
        page_id: "160083100857719"        # Philo — VERIFIED via ads_library_search MCP
        page_name: Philo
        country: US
        cadence: daily
        method: scrape
      - type: google_ads
        advertiser_id: "AR13265893387262754817"   # Philo, Inc. — resolved via SerpApi domain search (text=philo.com)
        page_name: Philo
        country: US                                # mapped to geo code 2840 on the SerpApi path
        cadence: daily
        method: api

